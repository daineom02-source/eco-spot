name: 대기질 자동 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분
  workflow_dispatch:        # Actions 탭에서 직접 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 에어코리아 대기질 받기
        env:
          AIRKOREA_KEY: ${{ secrets.AIRKOREA_KEY }}
        run: python scripts/fetch_air.py
      - name: 기상청 단기예보 받기
        env:
          AIRKOREA_KEY: ${{ secrets.AIRKOREA_KEY }}
        run: python scripts/fetch_weather.py
      - name: 바뀐 값 저장
        run: |
          git config user.name "eco-spot-bot"
          git config user.email "eco-spot-bot@users.noreply.github.com"
          git add data/air.json data/weather.json
          git diff --staged --quiet || (git commit -m "대기질·날씨 갱신" && git push)
